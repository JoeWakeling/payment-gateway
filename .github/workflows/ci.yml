name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The acquiring bank is stubbed at the HttpMessageHandler, so the suite needs
      # no running simulator and no other external dependency.
      - name: Test
        run: dotnet test --no-build --configuration Release

      # The Dockerfile is part of the deliverable, so a break in it should fail CI
      # rather than surface the first time someone runs the stack.
      - name: Build image
        run: docker compose build api
